name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .
      - name: Validate docker-compose.yml and its overrides
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.desktop.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.desktop.yml -f docker-compose.cpu.yml config --quiet

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -m "not spark"

  spark:
    name: Spark + Delta integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Cache Delta Lake JARs
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-3.2.0
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -m spark

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/frontend/*.test.mjs
