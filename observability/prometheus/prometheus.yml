global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: newsroom-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - newsroom-api:8085

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: dcgm-exporter
    static_configs:
      - targets:
          - dcgm-exporter:9400

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets:
          - redpanda:9644

  - job_name: spark-master
    metrics_path: /metrics/master/prometheus/
    static_configs:
      - targets:
          - spark-master:8080

  - job_name: spark-applications
    metrics_path: /metrics/applications/prometheus/
    static_configs:
      - targets:
          - spark-master:8080

  - job_name: spark-worker
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - spark-worker:8081

  - job_name: spark-bronze-driver
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - spark-bronze:4040

  - job_name: spark-silver-driver
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - spark-silver:4040

  - job_name: spark-gold-driver
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - spark-gold:4040
